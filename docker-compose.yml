services:
  app:
    build: .
    container_name: facturation_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=facturation
      - DB_USER=root
      - DB_PASS=root
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: facturation_db
    restart: always
    environment:
      MYSQL_DATABASE: facturation
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Initialisation de la BDD au premier lancement
      - ./database/facturation.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
