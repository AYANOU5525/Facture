services:
  # Service de l'application web PHP / Apache
  app:
    build: .
    container_name: facturation_app
    ports:
      - "8080:80"
      - "8443:443" # HTTPS auto-signé — nécessaire pour la caméra du scanner mobile sur un téléphone (cf. Dockerfile)
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT:-3306}
      - DB_NAME=${DOCKER_DB_NAME}
      - DB_USER=${DOCKER_DB_USER}
      - DB_PASS=${DOCKER_DB_PASS}
      # Surchargent le MAIL_HOST/MAIL_PORT du .env (mêmes variables que pour Laragon natif)
      # pour joindre par défaut le conteneur mailpit ci-dessous par son nom de service sur le
      # réseau Docker interne — Dotenv ne réécrit jamais une variable déjà présente dans
      # l'environnement. Définir DOCKER_MAIL_* dans .env pour un vrai SMTP (ex. Gmail).
      - MAIL_HOST=${DOCKER_MAIL_HOST:-mailpit}
      - MAIL_PORT=${DOCKER_MAIL_PORT:-1025}
      - MAIL_ENCRYPTION=${DOCKER_MAIL_ENCRYPTION:-none}
    depends_on:
      - db
      - mailpit

  # Attrape-mails de développement — capture tous les emails envoyés par l'appli (confirmation
  # d'inscription, réinitialisation de mot de passe...) sans les envoyer réellement : interface web
  # sur http://localhost:8025 pour les consulter, pratique pour une démo sans dépendre d'Internet.
  # Pour un vrai envoi (production ou démo avec réception sur un vrai téléphone), configurer un
  # compte SMTP réel dans .env (ex. Gmail + mot de passe d'application) à la place.
  mailpit:
    image: axllent/mailpit:latest
    container_name: facturation_mailpit
    restart: always
    ports:
      - "8025:8025" # Interface web de consultation des emails
      - "1025:1025" # Port SMTP (utilisé aussi par Laragon natif via 127.0.0.1:1025, cf. .env)

  # Service de la base de données MySQL
  db:
    image: mysql:8.0
    container_name: facturation_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASS}
    ports:
      - "3307:3306" # Port 3307 externe pour éviter tout conflit avec MySQL local de Laragon (3306)
    volumes:
      - db_data:/var/lib/mysql
      # Chargement automatique du schéma SQL de départ
      - ./database/facturation.sql:/docker-entrypoint-initdb.d/init.sql

  # Service phpMyAdmin pour gérer facilement la base de données via une interface web
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: facturation_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=${DOCKER_DB_HOST}
      - PMA_USER=${DOCKER_DB_USER}
      - PMA_PASSWORD=${DOCKER_DB_PASS}
    depends_on:
      - db

volumes:
  db_data:
